name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.

      - name: Debug key
        run: |
          printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | base64 -d > "$HOME/minisign.key"

          echo "---- FIRST 3 LINES ----"
          head -3 "$HOME/minisign.key"

          echo "---- SHOW INVISIBLE CHARS ----"
          cat -A "$HOME/minisign.key"

      - name: Build App
        shell: bash
        run: |
          # 1. Create a perfectly formatted file in the current directory
          # We use printf to ensure NO hidden characters or Windows newlines
          printf "untrusted comment: minisign secret key\n%s" "$MY_RAW_SECRET" > "$GITHUB_WORKSPACE/signing.key"
          
          # 2. Verify the file exists and is exactly 2 lines (for the logs)
          echo "File created at: $GITHUB_WORKSPACE/signing.key"
          wc -l "$GITHUB_WORKSPACE/signing.key"

          # 3. Pass the FILE PATH to the build command
          # We set the variable ONLY for the build process to avoid conflicts
          TAURI_SIGNING_PRIVATE_KEY="$GITHUB_WORKSPACE/signing.key" \
          npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_RAW_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Create Release
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Anime Checker v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}