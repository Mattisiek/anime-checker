name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.

      - name: Debug key
        run: |
          printf '%s' "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | base64 -d > "$HOME/minisign.key"

          echo "---- FIRST 3 LINES ----"
          head -3 "$HOME/minisign.key"

          echo "---- SHOW INVISIBLE CHARS ----"
          cat -A "$HOME/minisign.key"

      - name: Build and Release
        shell: bash
        run: |
          # Decode your dW5... secret into a real key file
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | base64 -d > "$HOME/signing.key"
          
          # Strip any potential Windows carriage returns just in case
          sed -i 's/\r//g' "$HOME/signing.key" || true
          
          # Run the tauri-action
          # We set the env variable to the PATH of the file we just made
          export TAURI_SIGNING_PRIVATE_KEY="$HOME/signing.key"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          
          # Explicitly call the action's logic via npm/cargo or let the action run
          # However, the cleanest way to use the 'uses' syntax with a file is:
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Point the action to the file we created in the previous step
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.HOME }}/signing.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: app-v__VERSION__
          releaseName: 'Anime Checker v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}