name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.
      - name: Validate key format
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > rawkey

          echo "Length:"
          wc -c rawkey

          echo "First 15 chars (hex):"
          head -c 15 rawkey | od -An -tx1
      - name: Debug & Validate Secret
        shell: bash
        run: |
          echo "--- SECRET INSPECTION ---"
          # Get length without printing the actual secret
          SECRET_LEN=${#MY_SECRET}
          echo "Total Secret Length: $SECRET_LEN characters"
          
          # Show the first 10 characters in Hex to find hidden spaces/newlines
          # Hex 20 = Space, Hex 0a = Newline, Hex 0d = Carriage Return
          echo -n "$MY_SECRET" | head -c 10 | xxd -p | sed 's/../& /g'
          echo "--- END INSPECTION ---"
        env:
          MY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}




          
      - name: 🔨 Final Stand Build
        shell: bash
        run: |
          # 1. Clear any 'ghost' variables from GitHub's default environment
          unset TAURI_SIGNING_PRIVATE_KEY
          
          # 2. Write the file to the CURRENT folder (No /tmp)
          # We name it 'signingkey' (no extension, no dots, no hyphens)
          python3 -c "
          import os
          raw_key = os.environ.get('MY_RAW_SECRET', '').strip()
          with open('signingkey', 'wb') as f:
              f.write(b'untrusted comment: minisign secret key\n')
              f.write(raw_key.encode('utf-8'))
              f.write(b'\n')
          "

          # --- 🔍 DEBUG CHECK ---
          echo "--- LOCAL FILE CHECK ---"
          echo "Line Count: $(grep -c $'' signingkey)"
          echo "First 15 bytes: $(head -c 15 signingkey | xxd -p)"
          # This should show './signingkey'
          echo "Target Path: ./signingkey"
          echo "------------------------"

          # 3. Use the LOCAL path with the ./ prefix
          # We pass it twice: once to the environment and once directly to the command
          export TAURI_SIGNING_PRIVATE_KEY="./signingkey"
          
          TAURI_SIGNING_PRIVATE_KEY="./signingkey" npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep the secret mapped to a different name to avoid collision
          MY_RAW_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}