name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.
      - name: Validate key format
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > rawkey

          echo "Length:"
          wc -c rawkey

          echo "First 15 chars (hex):"
          head -c 15 rawkey | od -An -tx1
      - name: Debug & Validate Secret
        shell: bash
        run: |
          echo "--- SECRET INSPECTION ---"
          # Get length without printing the actual secret
          SECRET_LEN=${#MY_SECRET}
          echo "Total Secret Length: $SECRET_LEN characters"
          
          # Show the first 10 characters in Hex to find hidden spaces/newlines
          # Hex 20 = Space, Hex 0a = Newline, Hex 0d = Carriage Return
          echo -n "$MY_SECRET" | head -c 15 | xxd -p | sed 's/../& /g'
          echo "--- END INSPECTION ---"
        env:
          MY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}





      - name: 🔨 Two-Block Build
        shell: bash
        run: |
          # 1. Define the Blocks
          # Block A: The Header (contains the spaces)
          HEADER_BLOCK="untrusted comment: minisign secret key"
          
          # Block B: Your Secret (from GitHub Secrets)
          KEY_BLOCK="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          
          # 2. Stitch them together into a file using a Python "Buffer"
          # This ensures the newline between them is a real byte, not a string '\n'
          python3 -c "
          import os
          h = os.environ.get('H_BLOCK')
          k = os.environ.get('K_BLOCK').strip()
          
          # Write the blocks to a file
          with open('final.key', 'wb') as f:
              f.write(h.encode('utf-8') + b'\n')
              f.write(k.encode('utf-8') + b'\n')
          "
          
          # --- 🔍 TWO-BLOCK DEBUG ---
          echo "--- STITCH CHECK ---"
          echo "Line 1 (Header): $(sed -n '1p' final.key)"
          echo "Line 2 (Key Start): $(sed -n '2p' final.key | cut -c 1-5)..."
          echo "Total Lines: $(wc -l < final.key)"
          echo "--------------------"

          # 3. Get the Absolute Path (Required for macOS/Linux)
          ABS_PATH=$(pwd)/final.key
          
          # 4. Set the Global Path
          echo "TAURI_SIGNING_PRIVATE_KEY=$ABS_PATH" >> $GITHUB_ENV
          
          # 5. Execute Build
          TAURI_SIGNING_PRIVATE_KEY="$ABS_PATH" npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          H_BLOCK: "untrusted comment: minisign secret key"
          K_BLOCK: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}