name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.
      - name: Validate key format
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > rawkey

          echo "Length:"
          wc -c rawkey

          echo "First 15 chars (hex):"
          head -c 15 rawkey | od -An -tx1
      - name: Debug & Validate Secret
        shell: bash
        run: |
          echo "--- SECRET INSPECTION ---"
          # Get length without printing the actual secret
          SECRET_LEN=${#MY_SECRET}
          echo "Total Secret Length: $SECRET_LEN characters"
          
          # Show the first 10 characters in Hex to find hidden spaces/newlines
          # Hex 20 = Space, Hex 0a = Newline, Hex 0d = Carriage Return
          echo -n "$MY_SECRET" | head -c 15 | xxd -p | sed 's/../& /g'
          echo "--- END INSPECTION ---"
        env:
          MY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}




      - name: 🔨 Universal Tauri v2 Build
        shell: bash
        run: |
          # 1. Create the key file INSIDE src-tauri
          # Using 'wb' and \n to ensure no Windows \r characters creep in
          python3 -c "
          import os, base64
          h = base64.b64decode('dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHNlY3JldCBrZXk=')
          k = os.environ.get('SECRET_INPUT', '').strip().encode('utf-8')
          with open('src-tauri/signer.key', 'wb') as f:
              f.write(h + b'\n')
              f.write(k + b'\n')
          "

          # 2. Define the path relative to the PROJECT root
          # Tauri's Rust core often prefers paths relative to where tauri.conf.json is
          RELATIVE_PATH="./signer.key"
          
          # 3. Set the environment variable globally for this job
          echo "TAURI_SIGNING_PRIVATE_KEY=$RELATIVE_PATH" >> $GITHUB_ENV
          
          # 4. Build
          # We don't set the variable inline here; we let the GITHUB_ENV handle it
          npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ensure this matches the RENAMED secret in your GitHub Setting
          SECRET_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}