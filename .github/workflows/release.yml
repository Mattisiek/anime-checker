name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.
      - name: Validate key format
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > rawkey

          echo "Length:"
          wc -c rawkey

          echo "First 15 chars (hex):"
          head -c 15 rawkey | od -An -tx1
      - name: Debug & Validate Secret
        shell: bash
        run: |
          echo "--- SECRET INSPECTION ---"
          # Get length without printing the actual secret
          SECRET_LEN=${#MY_SECRET}
          echo "Total Secret Length: $SECRET_LEN characters"
          
          # Show the first 10 characters in Hex to find hidden spaces/newlines
          # Hex 20 = Space, Hex 0a = Newline, Hex 0d = Carriage Return
          echo -n "$MY_SECRET" | head -c 10 | xxd -p | sed 's/../& /g'
          echo "--- END INSPECTION ---"
        env:
          MY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: 🔨 Build App
        shell: bash
        run: |
          # 1. Create the content and write to a file using Python
          python3 -c "
          import os
          raw_key = os.environ.get('MY_SECRET', '').strip()
          header = 'untrusted comment: minisign secret key'
          # This ensures a clean newline (\n) between the header and the RW key
          final_content = f'{header}\n{raw_key}'
          
          with open('signing.key', 'w', encoding='utf-8', newline='\n') as f:
              f.write(final_content)
          "

          # --- 🔍 DEBUG FINAL CONTENT ---
          echo "--- FILE ANATOMY ---"
          # Count lines: should be exactly 2
          echo "Line count: $(wc -l < signing.key)"
          # Check for 'untrusted' (75 6e 74...)
          echo "Start of file (Hex):"
          head -c 15 signing.key | xxd -p
          # Check for the transition from header to RW key
          # This is where 'Symbol 32' usually hides
          echo "Middle of file (Hex around newline):"
          grep -aob "key" signing.key | head -n 1
          # --- END DEBUG ---

          # 2. Tell Tauri where the file is (Absolute Path)
          export TAURI_SIGNING_PRIVATE_KEY="$(pwd)/signing.key"
          
          # 3. Build
          npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}