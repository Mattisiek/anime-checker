name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.
      - name: Validate key format
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > rawkey

          echo "Length:"
          wc -c rawkey

          echo "First 15 chars (hex):"
          head -c 15 rawkey | od -An -tx1
      - name: Debug & Validate Secret
        shell: bash
        run: |
          echo "--- SECRET INSPECTION ---"
          # Get length without printing the actual secret
          SECRET_LEN=${#MY_SECRET}
          echo "Total Secret Length: $SECRET_LEN characters"
          
          # Show the first 10 characters in Hex to find hidden spaces/newlines
          # Hex 20 = Space, Hex 0a = Newline, Hex 0d = Carriage Return
          echo -n "$MY_SECRET" | head -c 10 | xxd -p | sed 's/../& /g'
          echo "--- END INSPECTION ---"
        env:
          MY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: 🔨 Build App
        shell: bash
        run: |
          # We write in Binary Mode ('wb') to force exact byte placement
          python3 -c "
          import os
          raw_key = os.environ.get('MY_SECRET', '').strip()
          
          # Encode everything to raw bytes
          header = b'untrusted comment: minisign secret key\n'
          key_bytes = raw_key.encode('utf-8')
          # Add one final newline at the very end of the file
          footer = b'\n'
          
          with open('signing.key', 'wb') as f:
              f.write(header)
              f.write(key_bytes)
              f.write(footer)
          "

          # --- 🔍 FINAL VERIFICATION ---
          echo "File Hex Dump (check for 0a newline):"
          # Look for '0a' (the newline) after 'key' (6b 65 79)
          xxd -p signing.key | tr -d '\n' | grep -o '6b65790a5257' && echo "✅ Found Newline!" || echo "❌ No Newline found"
          
          echo "Total Line Count:"
          grep -c $'' signing.key

          # 2. Set the absolute path
          export TAURI_SIGNING_PRIVATE_KEY="$(pwd)/signing.key"
          
          # 3. Build
          npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          