name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.
      - name: Validate key format
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > rawkey

          echo "Length:"
          wc -c rawkey

          echo "First 15 chars (hex):"
          head -c 15 rawkey | od -An -tx1
      - name: Debug & Validate Secret
        shell: bash
        run: |
          echo "--- SECRET INSPECTION ---"
          # Get length without printing the actual secret
          SECRET_LEN=${#MY_SECRET}
          echo "Total Secret Length: $SECRET_LEN characters"
          
          # Show the first 10 characters in Hex to find hidden spaces/newlines
          # Hex 20 = Space, Hex 0a = Newline, Hex 0d = Carriage Return
          echo -n "$MY_SECRET" | head -c 15 | xxd -p | sed 's/../& /g'
          echo "--- END INSPECTION ---"
        env:
          MY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}





      - name: 🔨 Double-Base64 Build
        shell: bash
        run: |
          # 1. THE BLOCKS (Encoded to hide spaces/symbols)
          # 'dW50cnVzdGVk...' is 'untrusted comment: minisign secret key'
          H64="dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHNlY3JldCBrZXk="
          
          # Your RW... key from secrets
          K_RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          
          # 2. THE STITCH (Using Python to safely combine them)
          python3 -c "
          import os, base64
          # Decode the header 'block'
          header = base64.b64decode('$H64'.encode('utf-8'))
          # Get the raw key 'block'
          key = os.environ.get('K_RAW', '').strip().encode('utf-8')
          
          # Write to final file with a clean newline byte (0x0A)
          with open('final.key', 'wb') as f:
              f.write(header + b'\n')
              f.write(key + b'\n')
          "

          # --- 🔍 CIPHER DEBUG ---
          echo "--- DOUBLE-BLOCK CHECK ---"
          echo "Line 1 (Decoded Header): $(head -n 1 final.key)"
          echo "Total Line Count: $(wc -l < final.key)"
          echo "File Path: $(pwd)/final.key"
          echo "-------------------------"

          # 3. SET THE PATH (Use Absolute Path for macOS/Linux)
          ABS_PATH=$(pwd)/final.key
          echo "TAURI_SIGNING_PRIVATE_KEY=$ABS_PATH" >> $GITHUB_ENV
          
          # 4. RUN THE BUILD
          # Passing the variable inline is the most aggressive 'override'
          TAURI_SIGNING_PRIVATE_KEY=\"$ABS_PATH\" npm run tauri build -- ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          K_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}